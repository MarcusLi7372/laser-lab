<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laser Lab</title>
<meta name="description" content="Every Laser Lab 3D print in one place: search, pick a colour, pay and pick up in Richmond Hill.">
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#09090B;--card:#17171C;--card2:#1F1F26;--ink:#FFF5EC;--muted:#B4A79C;--line:rgba(255,245,236,.12);--red:#E8321E;--orange:#FF7A1F;--hot:linear-gradient(100deg,#E8321E,#FF7A1F);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.92);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{font:800 15px Unbounded,"Arial Black",sans-serif;letter-spacing:.02em}.brand b i{font-style:normal;color:var(--orange)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 14px;transition:border-color .2s}
.search:focus-within{border-color:var(--orange)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:11px 0}
.go3d{flex-shrink:0;text-decoration:none;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--hot);white-space:nowrap}
.cartbtn{flex-shrink:0;position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700}
.cartbtn b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#111;font-size:12px;display:grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.chips button{flex-shrink:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.banner{margin:18px 0 6px;padding:16px 20px;border-radius:16px;background:linear-gradient(100deg,#2a0e07,#17171C);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;font-weight:700}
.banner span{color:var(--orange)}
.count{color:var(--muted);font-size:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,122,31,.5)}
.card .ph{aspect-ratio:1;background:radial-gradient(circle at 50% 62%,#3a1c10,#17171C 72%);overflow:hidden;padding:8px}
.card img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.card:hover img{transform:scale(1.07) rotate(-1.5deg)}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:15px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;justify-content:space-between}
.card .pr b{font:800 20px Unbounded,"Arial Black",sans-serif;color:var(--orange)}
.card .pr small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* product sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.panel{background:var(--card);border-radius:20px;max-width:880px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line)}
.gal{background:radial-gradient(circle at 50% 62%,#3a1c10,#111115 72%);position:relative}
.gal .main{width:100%;aspect-ratio:1;object-fit:contain;display:block;padding:14px;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.gal canvas{width:100%!important;aspect-ratio:1;height:auto!important;display:block;touch-action:none;cursor:grab}
.tog{position:absolute;top:10px;left:10px;z-index:2;display:flex;background:rgba(0,0,0,.65);border-radius:999px;padding:3px}
.tog button{border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px}
.tog button[aria-pressed=true]{background:var(--hot)}
.hint3d{position:absolute;left:12px;top:52px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.qbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qbox small{color:var(--orange);font-weight:800;font-size:11px;letter-spacing:.08em}
.qbox h4{margin:3px 0 8px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.opts button[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,31,.15)}
.qbox input{margin-top:8px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-bottom:6px}
.thumbs{display:flex;gap:6px;padding:8px;background:var(--card2);overflow-x:auto}
.thumbs img{width:58px;height:58px;object-fit:contain;background:#1b1b22;border-radius:8px;opacity:.6;border:2px solid transparent;cursor:pointer}
.thumbs img[aria-current=true]{opacity:1;border-color:var(--orange)}
.det{padding:22px;display:flex;flex-direction:column;gap:14px}
.det h2{margin:0;font:800 22px/1.2 Unbounded,"Arial Black",sans-serif}
.det .price{font:800 30px Unbounded,"Arial Black",sans-serif;color:var(--orange)}
.det p{margin:0;color:var(--muted)}
.lbl{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sws{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.qty button{background:none;border:0;width:40px;height:40px;font-size:20px}
.qty span{min-width:30px;text-align:center;font-weight:800}
.btn{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:var(--hot);width:100%}
.btn.line{background:none;border:1.5px solid var(--line)}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px}
.note{font-size:13px;color:var(--muted)}
/* cart */
.cart{max-width:520px;grid-template-columns:1fr}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#fff}
.row div{flex:1;min-width:0}.row small{color:var(--muted)}
.row button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px}.field input{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}
.err{color:#ff8a7a;font-size:14px;min-height:1em;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--ink);color:#111;font-weight:800;padding:12px 18px;border-radius:999px;z-index:60;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
@media (max-width:720px){
  .top{flex-wrap:wrap}.search{order:3;flex-basis:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .panel{grid-template-columns:minmax(0,1fr)}
  .go3d{padding:9px 12px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="brand" href="./" aria-label="Laser Lab shop"><img src="assets/logo.webp" alt=""><b>LASER <i>LAB</i></b></a>
    <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Search prints, like vase or dino" aria-label="Search products"></label>
    <button class="cartbtn" id="cartBtn" aria-label="Open cart">Cart <b id="cartN" hidden>0</b></button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
</div></header>

<main class="wrap">
  <div class="banner">Printed in Richmond Hill by Liam <span>·</span> Free pickup</div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No prints match that. Try "vase", "flexi" or "pen".</p>
</main>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script>
/* Products: names, prices and descriptions set for Liam. Photos are in img/<id>-<n>.webp */
const P=[
 {id:'organizer',n:'Desk Organizer',p:18,c:'desk',imgs:3,d:'Big desk organizer with 8 sections and 2 round pen slots. Holds pencils, pens, rulers and scissors.',k:'pen holder pencil storage school'},
 {id:'dino-holder',n:'Dino Pen Holder',p:16,c:'desk',imgs:4,d:'A happy dinosaur that holds your pens and pencils in its mouth. Spikes down its back and tail.',k:'dinosaur trex pencil cup'},
 {id:'pencil-cup',n:'Round Pencil Cup',p:6,c:'desk',imgs:1,d:'Simple, tall round cup for pens and pencils.',k:'pen holder cylinder'},
 {id:'gem-cup',n:'Gem Cup',p:10,c:'desk',imgs:2,d:'Cup with cool folded gem-shaped sides. Use it for pens, makeup brushes or as a small vase.',k:'faceted geometric vase pencil'},
 {id:'twist-vase',n:'Twist Vase',p:12,c:'decor',imgs:3,d:'Tall vase with smooth spiral ridges that twist all the way up. Great for dried flowers.',k:'spiral flower'},
 {id:'wave-vase',n:'Wave Vase',p:15,c:'decor',imgs:1,d:'Big vase with a wide wavy bottom and a textured pattern you can feel.',k:'textured flower'},
 {id:'reindeer',n:'Reindeer',p:10,c:'decor',imgs:1,d:'Ribbed reindeer with antlers. A fun holiday decoration for a shelf or table.',k:'deer christmas holiday antlers'},
 {id:'moose',n:'Moose Shelf Sitter',p:10,c:'decor',imgs:1,d:'Silly moose with long dangly legs that sits on the edge of a shelf or plant pot. Pot not included.',k:'shelf buddy antlers'},
 {id:'ghost',n:'Ghost Buddy',p:7,c:'decor',imgs:1,d:'Little square ghost with a surprised face. Cute desk decoration.',k:'halloween spooky'},
 {id:'pyramid',n:'Pixel Pyramid',p:8,c:'decor',imgs:2,d:'Pyramid made of tiny stepped blocks that look like pixels. Cool desk art.',k:'geometric sculpture'},
 {id:'spiral',n:'Pop-Up Spiral',p:8,c:'fidget',imgs:3,d:'Pull the stick and the rings pop up into a cone, push it down and it goes flat again. Very satisfying.',k:'fidget toy cone'},
 {id:'slinky-cat',n:'Slinky Cat',p:7,c:'fidget',imgs:3,d:'Stretchy cat with a springy body that bends and stretches like a slinky.',k:'stretchy spring kitty fidget'},
 {id:'flexi-cat',n:'Flexi Cat',p:5,c:'flexi',imgs:1,d:'Bendy cat with moving joints. Wiggle it into any pose.',k:'articulated kitty'},
 {id:'shark',n:'Flexi Shark',p:5,c:'flexi',imgs:1,d:'Bendy shark with moving body parts that swish side to side.',k:'articulated fish'},
 {id:'ray',n:'Flexi Stingray',p:5,c:'flexi',imgs:1,d:'Bendy stingray with flapping wings and a wiggly tail.',k:'articulated manta'},
 {id:'bunny',n:'Flexi Bunny',p:5,c:'flexi',imgs:1,d:'Cute bendy bunny with moving joints.',k:'articulated rabbit'},
 {id:'otter',n:'Flexi Otter',p:6,c:'flexi',imgs:1,d:'Bendy otter that floats on its back, with a long jointed tail.',k:'articulated'},
 {id:'mini-dino',n:'Mini Dino',p:2,c:'flexi',imgs:3,d:'Tiny dinosaur with spikes down its back. Collect a whole herd.',k:'dinosaur small figure'}
];
const CATS=[['all','All'],['desk','Desk'],['decor','Decor'],['fidget','Fidgets'],['flexi','Flexi animals']];
const COLORS=[['Lightning Red','#E8321E'],['Laser Orange','#FF7A1F'],['Electric Blue','#2F6BFF']];
const PAYPAL_CLIENT_ID='AcZbNJ_YQsMhEfDwivCnttojjcMxhWML8IiANCDVzcSHX0EMpK1GiO1dZ5OQuMUXQPilKRud5Km0CKMv';
const PICKUP='23 Solar Street, Richmond Hill, ON';

const $=s=>document.querySelector(s);
const img=(p,i=1)=>`shop/img/${p.id}-${i}c.webp`;
const HOUSE=p=>p.c==='desk'||p.c==='decor';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cat='all',cart=[];
try{cart=JSON.parse(localStorage.getItem('ll-cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('ll-cart',JSON.stringify(cart))}catch(e){};const n=cart.reduce((a,b)=>a+b.q,0);$('#cartN').hidden=!n;$('#cartN').textContent=n};
let tt;const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),1800)};

CATS.forEach(([v,l])=>{const b=document.createElement('button');b.textContent=l;b.setAttribute('aria-pressed',v===cat);b.onclick=()=>{cat=v;[...$('#chips').children].forEach(x=>x.setAttribute('aria-pressed',x===b));render()};$('#chips').appendChild(b)});

function render(){
  const q=$('#q').value.trim().toLowerCase();
  const list=P.filter(p=>(cat==='all'||p.c===cat)&&(!q||(p.n+' '+p.d+' '+p.k+' '+p.c).toLowerCase().includes(q)));
  $('#grid').innerHTML=list.map(p=>`<button class="card" data-id="${p.id}"><div class="ph"><img src="${img(p)}" alt="${esc(p.n)}" loading="lazy"></div><div class="info"><h3>${esc(p.n)}</h3><p>${esc(p.d)}</p><div class="pr"><b>$${p.p}</b><small>${p.imgs>1?p.imgs+' photos':''}</small></div></div></button>`).join('');
  $('#count').textContent=list.length+' print'+(list.length===1?'':'s');$('#empty').hidden=!!list.length;
}
$('#q').addEventListener('input',render);
$('#grid').addEventListener('click',e=>{const c=e.target.closest('.card');if(c)openProduct(c.dataset.id)});

function close(){$('#sheet').hidden=true;$('#sheet').innerHTML='';document.body.style.overflow=''}
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet'||e.target.closest('.x'))close()});
addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function openSheet(html,cls=''){$('#sheet').innerHTML=`<div class="panel ${cls}" role="dialog" aria-modal="true">${html}</div>`;$('#sheet').hidden=false;document.body.style.overflow='hidden'}

const WHO=['Me','A family member','A gift','A friend','Not sure yet'];
function openProduct(id){
  const p=P.find(x=>x.id===id),house=HOUSE(p);let q=1,who='';
  const th=Array.from({length:p.imgs},(_,i)=>`<img src="${img(p,i+1)}" alt="" data-i="${i+1}" aria-current="${i===0}">`).join('');
  const qs=house?`<div class="qbox"><h4 style="margin-top:0">Who is this print for?</h4><div class="opts" id="qWho">${WHO.map(w=>`<button aria-pressed="false">${w}</button>`).join('')}</div></div>`:'';
  openSheet(`<div class="gal"><button class="x" aria-label="Close">✕</button><img class="main" src="${img(p)}" alt="${esc(p.n)}">${p.imgs>1?`<div class="thumbs">${th}</div>`:''}</div>
  <div class="det"><div><span class="tag">${{desk:'Desk',decor:'Decor',fidget:'Fidget',flexi:'Flexi animal'}[p.c]}</span><h2>${esc(p.n)}</h2></div><div class="price">$${p.p}</div><p>${esc(p.d)}</p>
  ${qs}<p class="note">You get it just like the photo.</p>
  <div><div class="lbl">Quantity</div><div class="qty"><button data-d="-1" aria-label="Less">−</button><span id="qn">1</span><button data-d="1" aria-label="More">+</button></div></div>
  <button class="btn" id="add">Add to cart · $${p.p}</button></div>`);
  const s=$('#sheet'),main=s.querySelector('.main');
  s.querySelectorAll('.thumbs img').forEach(t=>t.onclick=()=>{main.src=t.src;s.querySelectorAll('.thumbs img').forEach(x=>x.setAttribute('aria-current',x===t))});
  if(house)s.querySelectorAll('#qWho button').forEach(b=>b.onclick=()=>{who=b.textContent;s.querySelectorAll('#qWho button').forEach(x=>x.setAttribute('aria-pressed',x===b))});
  s.querySelectorAll('.qty button').forEach(b=>b.onclick=()=>{q=Math.max(1,Math.min(20,q+ +b.dataset.d));$('#qn').textContent=q;$('#add').textContent='Add to cart · $'+p.p*q});
  $('#add').onclick=()=>{const ex=cart.find(x=>x.id===p.id&&(x.who||'')===who);if(ex)ex.q+=q;else cart.push({id:p.id,q,who});save();close();toast('Added to cart')};
}
let ppLoad;
function loadPP(){return ppLoad||(ppLoad=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://www.paypal.com/sdk/js?client-id='+encodeURIComponent(PAYPAL_CLIENT_ID)+'&currency=CAD&intent=capture&components=buttons&disable-funding=paylater,venmo';s.onload=()=>window.paypal&&window.paypal.Buttons?ok():no();s.onerror=no;document.head.appendChild(s)}))}
const total=()=>cart.reduce((a,it)=>a+P.find(p=>p.id===it.id).p*it.q,0);

function openCart(){
  if(!cart.length){openSheet(`<div class="det"><button class="x" aria-label="Close" style="position:static;align-self:flex-end;background:var(--card2)">✕</button><h2>Your cart is empty</h2><p>Tap a print to add it.</p></div>`,'cart');return}
  const rows=cart.map((it,i)=>{const p=P.find(x=>x.id===it.id);return `<div class="row"><img src="${img(p)}" alt=""><div><b>${esc(p.n)}</b><br><small>${it.who?'For: '+esc(it.who)+' · ':''}${it.q} × $${p.p}</small></div><span>$${p.p*it.q}</span><button data-rm="${i}">Remove</button></div>`}).join('');
  openSheet(`<div class="det"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Your cart</h2><button class="x" aria-label="Close" style="position:static;background:var(--card2)">✕</button></div>
  <div>${rows}</div><div class="tot"><span>Total</span><span>$${total()} CAD</span></div>
  <p class="note">Free pickup at ${PICKUP}. We'll email you to set a pickup time.</p>
  <label class="field"><b>Your name</b><input id="cName" autocomplete="name"></label>
  <label class="field"><b>Email</b><input id="cEmail" type="email" autocomplete="email"></label>
  <p class="err" id="cErr"></p><div id="pp"></div><p class="note" id="ppNote">Loading checkout...</p></div>`,'cart');
  $('#sheet').querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{cart.splice(+b.dataset.rm,1);save();openCart()});
  const ok=()=>{const n=$('#cName').value.trim(),m=$('#cEmail').value.trim();const bad=!n?'Add your name.':!/^\S+@\S+\.\S+$/.test(m)?'Add a real email so we can set up pickup.':'';$('#cErr').textContent=bad;return !bad};
  loadPP().then(()=>{$('#ppNote').textContent='Pay with PayPal or a card.';window.paypal.Buttons({style:{layout:'vertical',shape:'rect',color:'gold',label:'pay',height:48},
    onClick:(d,a)=>ok()?a.resolve():a.reject(),
    createOrder:(d,a)=>a.order.create({purchase_units:[{description:cart.map(it=>{const p=P.find(x=>x.id===it.id);return it.q+'x '+p.n+(it.who?' for '+it.who:'')}).join('; ').slice(0,127),amount:{currency_code:'CAD',value:total().toFixed(2)}}]}),
    onApprove:(d,a)=>a.order.capture().then(()=>done(true)),
    onError:()=>{$('#cErr').textContent="Payment didn't go through. Try again."}}).render('#pp')})
  .catch(()=>{$('#ppNote').textContent='Checkout could not load here. Open the shop on its live link to pay.'});
}
function done(paid){
  const items=cart.map(it=>{const p=P.find(x=>x.id===it.id);return `${it.q} × ${p.n}${it.who?' (for '+esc(it.who)+')':''}`}).join('<br>');const t=total();
  cart=[];save();
  openSheet(`<div class="det"><h2>${paid?'Paid! Thank you':'Order saved'}</h2><p>${items}</p><div class="tot"><span>Total</span><span>$${t} CAD</span></div>
  <p>Pick up at <b>${PICKUP}</b>. We'll email you to set a time.</p><button class="btn" onclick="document.getElementById('sheet').click()">Keep shopping</button></div>`,'cart');
}
$('#cartBtn').onclick=openCart;
save();render();
if(location.hash==='#cart')openCart();
</script>
</body>
</html>
