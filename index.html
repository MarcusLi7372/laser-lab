<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Laser Lab</title>
<meta name="description" content="Every Laser Lab 3D print in one place: search, pick a colour, pay and pick up in Richmond Hill.">
<link rel="icon" href="assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Manrope:wght@400;600;700;800&display=swap">
<style>
:root{--bg:#09090B;--card:#17171C;--card2:#1F1F26;--ink:#FFF5EC;--muted:#B4A79C;--line:rgba(255,245,236,.12);--red:#E8321E;--orange:#FF7A1F;--hot:linear-gradient(100deg,#E8321E,#FF7A1F);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:0;z-index:20;background:rgba(9,9,11,.92);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:14px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0}
.brand img{width:40px;height:40px;object-fit:contain}
.brand b{font:800 15px Unbounded,"Arial Black",sans-serif;letter-spacing:.02em}.brand b i{font-style:normal;color:var(--orange)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:0 14px;transition:border-color .2s}
.search:focus-within{border-color:var(--orange)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;padding:11px 0}
.go3d{flex-shrink:0;text-decoration:none;font-weight:800;font-size:14px;padding:10px 16px;border-radius:999px;background:var(--hot);white-space:nowrap}
.cartbtn{flex-shrink:0;position:relative;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700}
.cartbtn b{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--orange);color:#111;font-size:12px;display:grid;place-items:center;padding:0 5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-block:0 12px;scrollbar-width:none}
.chips button{flex-shrink:0;background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.chips button[aria-pressed=true]{background:var(--ink);color:#111;border-color:var(--ink)}
.banner{margin:18px 0 6px;padding:16px 20px;border-radius:16px;background:linear-gradient(100deg,#2a0e07,#17171C);border:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 20px;align-items:center;font-weight:700}
.banner span{color:var(--orange)}
.count{color:var(--muted);font-size:14px;margin:12px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;padding-bottom:40px}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,122,31,.5)}
.card .ph{aspect-ratio:1;background:radial-gradient(circle at 50% 62%,#3a1c10,#17171C 72%);overflow:hidden;padding:8px}
.card img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .4s;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.card:hover img{transform:scale(1.07) rotate(-1.5deg)}
.card .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card h3{margin:0;font-size:15px;line-height:1.3}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{margin-top:auto;padding-top:6px;display:flex;align-items:baseline;justify-content:space-between}
.card .pr b{font:800 20px Unbounded,"Arial Black",sans-serif;color:var(--orange)}
.card .pr small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:60px 0}
/* product sheet */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:16px}
.panel{background:var(--card);border-radius:20px;max-width:880px;width:100%;max-height:92vh;overflow:auto;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);border:1px solid var(--line)}
.gal{background:radial-gradient(circle at 50% 62%,#3a1c10,#111115 72%);position:relative}
.gal .main{width:100%;aspect-ratio:1;object-fit:contain;display:block;padding:14px;filter:drop-shadow(0 16px 22px rgba(0,0,0,.5))}
.gal canvas{width:100%!important;aspect-ratio:1;height:auto!important;display:block;touch-action:none;cursor:grab}
.tog{position:absolute;top:10px;left:10px;z-index:2;display:flex;background:rgba(0,0,0,.65);border-radius:999px;padding:3px}
.tog button{border:0;background:none;border-radius:999px;padding:7px 13px;font-weight:800;font-size:13px}
.tog button[aria-pressed=true]{background:var(--hot)}
.hint3d{position:absolute;left:12px;top:52px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);pointer-events:none}
.qbox{background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.qbox small{color:var(--orange);font-weight:800;font-size:11px;letter-spacing:.08em}
.qbox h4{margin:3px 0 8px;font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{background:none;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.opts button[aria-pressed=true]{border-color:var(--orange);background:rgba(255,122,31,.15)}
.qbox input{margin-top:8px;width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;color:var(--ink);font:inherit}
.tag{display:inline-block;font-size:12px;font-weight:800;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin-bottom:6px}
.thumbs{display:flex;gap:6px;padding:8px;background:var(--card2);overflow-x:auto}
.thumbs img{width:58px;height:58px;object-fit:contain;background:#1b1b22;border-radius:8px;opacity:.6;border:2px solid transparent;cursor:pointer}
.thumbs img[aria-current=true]{opacity:1;border-color:var(--orange)}
.det{padding:22px;display:flex;flex-direction:column;gap:14px}
.det h2{margin:0;font:800 22px/1.2 Unbounded,"Arial Black",sans-serif}
.det .price{font:800 30px Unbounded,"Arial Black",sans-serif;color:var(--orange)}
.det p{margin:0;color:var(--muted)}
.lbl{font-weight:800;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.sws{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1.5px var(--line)}
.sw[aria-pressed=true]{border-color:var(--ink)}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:999px}
.qty button{background:none;border:0;width:40px;height:40px;font-size:20px}
.qty span{min-width:30px;text-align:center;font-weight:800}
.btn{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:16px;background:var(--hot);width:100%}
.btn.line{background:none;border:1.5px solid var(--line)}
.x{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:20px}
.note{font-size:13px;color:var(--muted)}
/* cart */
.cart{max-width:520px;grid-template-columns:1fr}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.row img{width:56px;height:56px;border-radius:8px;object-fit:cover;background:#fff}
.row div{flex:1;min-width:0}.row small{color:var(--muted)}
.row button{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:18px}
.field{display:flex;flex-direction:column;gap:5px}.field input{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--ink);font:inherit}
.err{color:#ff8a7a;font-size:14px;min-height:1em;margin:0}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);background:var(--ink);color:#111;font-weight:800;padding:12px 18px;border-radius:999px;z-index:60;transition:transform .3s}
.toast.on{transform:translate(-50%,0)}
@media (max-width:720px){
  .top{flex-wrap:wrap}.search{order:3;flex-basis:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .panel{grid-template-columns:minmax(0,1fr)}
  .go3d{padding:9px 12px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <a class="brand" href="./" aria-label="Laser Lab shop"><img src="assets/logo.webp" alt=""><b>LASER <i>LAB</i></b></a>
    <label class="search"><span aria-hidden="true">🔍</span><input id="q" type="search" placeholder="Search prints, like vase or dino" aria-label="Search products"></label>
    <button class="cartbtn" id="cartBtn" aria-label="Open cart">Cart <b id="cartN" hidden>0</b></button>
  </div>
  <div class="chips" id="chips" role="group" aria-label="Categories"></div>
</div></header>

<main class="wrap">
  <div class="banner">Printed in Richmond Hill by Liam <span>·</span> Free pickup <span>·</span> Every print in red, orange or blue</div>
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No prints match that. Try "vase", "flexi" or "pen".</p>
</main>

<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast"></div>

<script>
const MODELS_SRC="/* ---- Liam's real products, built from shapes to match his photos ---- */\nvar V3=THREE.Vector3;\nfunction sph(r,m,x,y,z,sx=1,sy=1,sz=1){const o=mesh(new THREE.SphereGeometry(r,28,18),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);return o}\nfunction cyl(r1,r2,h,m,x=0,y=0,z=0,seg=24){const o=mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m);o.position.set(x,y+h/2,z);return o}\nfunction cone(r,h,m,x,y,z,rx=0,rz=0){const o=mesh(new THREE.ConeGeometry(r,h,14),m);o.position.set(x,y,z);o.rotation.set(rx,0,rz);return o}\nfunction rbox(w,h,d,r,m,x=0,y=0,z=0){const s=new THREE.Shape(),a=w/2-r,b=h/2-r;s.moveTo(-a,-h/2);s.lineTo(a,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-b);s.lineTo(w/2,b);s.quadraticCurveTo(w/2,h/2,a,h/2);s.lineTo(-a,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,b);s.lineTo(-w/2,-b);s.quadraticCurveTo(-w/2,-h/2,-a,-h/2);\n  const bv=Math.min(r,d/2)*.9,geo=new THREE.ExtrudeGeometry(s,{depth:Math.max(.01,d-2*bv),bevelEnabled:true,bevelThickness:bv,bevelSize:bv*.6,bevelSegments:4,curveSegments:8});geo.translate(0,0,-(d-2*bv)/2);const o=mesh(geo,m);o.position.set(x,y,z);return o}\nconst dark=()=>window._dark||(window._dark=makeMaterial('#18181c','pla'));\nconst eyes=(g,x,y,z,r=.07)=>{g.add(sph(r,dark(),-x,y,z,1,1,.5));g.add(sph(r,dark(),x,y,z,1,1,.5))};\nfunction ribLathe(H,rf,ribs,amp,tw,closed){const N=70,pts=[[0,0]];for(let i=0;i<=N;i++){const y=i/N*H;pts.push([rf(y),y])}\n  if(closed)pts.push([0,H]);else{for(let i=N;i>=2;i--){const y=i/N*H;pts.push([rf(y)-.04,y])}pts.push([0,.06])}\n  const geo=lathe(pts,Math.max(96,ribs*8)),p=geo.attributes.position,v=new V3();\n  for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const r=Math.hypot(v.x,v.z);if(r<1e-4)continue;let a=Math.atan2(v.z,v.x);const r2=r*(1+amp*Math.abs(Math.cos(ribs/2*a)));a+=v.y*tw;p.setXYZ(i,Math.cos(a)*r2,v.y,Math.sin(a)*r2)}\n  geo.computeVertexNormals();return geo}\nfunction segs(g,m,n,len,w,h,y,fn){for(let i=0;i<n;i++){const t=i/(n-1),k=fn?fn(t):1;g.add(rbox(w*k,h*k,len/n*.86,.08*k,m,0,y,-i*len/n))}}\nObject.assign(BUILD,{\n  organizer(m){const g=new THREE.Group();g.add(mesh(lathe([[0,0],[1,0],[1,1.6],[.95,1.6],[.95,.07],[0,.07]],8).toNonIndexed(),m));g.children[0].scale.set(1.25,1,.9);g.children[0].geometry.computeVertexNormals();\n    g.add(mesh(new THREE.BoxGeometry(2.2,1.45,.04),m));g.children[1].position.y=.75;\n    [-.42,.05,.5].forEach(x=>{const d=mesh(new THREE.BoxGeometry(.04,1.45,.8),m);d.position.set(x,.75,-.42);g.add(d);const e=d.clone();e.position.z=.42;g.add(e)});\n    [-.95,.95].forEach(x=>{const t=mesh(lathe([[.2,.07],[.25,.07],[.25,1.6],[.2,1.6]],28),m);t.position.x=x*.86;g.add(t)});return g},\n  'dino-holder'(m){const g=new THREE.Group();g.add(mesh(lathe([[0,0],[.7,.04],[.92,.5],[.9,1.15],[.74,1.75],[.62,2.1],[.55,2.1],[.66,1.75],[.82,1.15],[.84,.5],[.62,.1],[0,.1]],48),m));\n    for(let i=0;i<9;i++){const y=.25+i*.2;g.add(cone(.09,.22,m,0,y,-(.85-Math.abs(y-1)*.12),-Math.PI/2))}\n    const tail=cone(.28,1.1,m,0,.28,-1.05,-Math.PI/2+.25);g.add(tail);[[-.45],[.45]].forEach(([x])=>{g.add(sph(.28,m,x,.18,.55,1,.75,1.3));g.add(sph(.13,m,x*.95,1.15,.72,.7,1.6,.7))});\n    [-.36,.36].forEach(x=>{const e=mesh(new THREE.TorusGeometry(.09,.02,6,14,Math.PI),dark());e.position.set(x,1.72,.55);e.rotation.set(0,x>0?.5:-.5,Math.PI);g.add(e)});return g},\n  'pencil-cup'(m){const g=new THREE.Group();g.add(mesh(lathe([[0,0],[.58,0],[.6,2.3],[.52,2.3],[.5,.1],[0,.1]],48),m));return g},\n  'gem-cup'(m){let geo=lathe([[0,0],[.62,0],[.86,.7],[.84,1.45],[.72,1.95],[.64,1.95],[.76,1.45],[.78,.7],[.56,.08],[0,.08]],9).toNonIndexed();const p=geo.attributes.position,v=new V3();\n    for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);const a=Math.atan2(v.z,v.x)+v.y*.42,r=Math.hypot(v.x,v.z);p.setXYZ(i,Math.cos(a)*r,v.y,Math.sin(a)*r)}geo.computeVertexNormals();const g=new THREE.Group();g.add(mesh(geo,m));return g},\n  'twist-vase'(m){const g=new THREE.Group();g.add(mesh(ribLathe(2.6,y=>.32+.36*Math.exp(-Math.pow((y-.95)/.62,2))+.08*Math.max(0,y-2.2)*4,14,.12,.7,false),m));return g},\n  'wave-vase'(m){const g=new THREE.Group();g.add(mesh(ribLathe(2.2,y=>.34+.78*Math.exp(-Math.pow((y-.12)/.5,2))+.12*Math.max(0,y-1.7)*2,24,.07,.9,false),m));return g},\n  reindeer(m){const g=new THREE.Group();g.add(mesh(ribLathe(2.1,y=>{const b=.48*Math.exp(-Math.pow((y-.62)/.75,2)),h=.36*Math.exp(-Math.pow((y-1.78)/.26,2));return Math.max(.27,b,h)*(y>1.95?Math.sqrt(Math.max(0,(2.1-y)/.15)):1)+.02},40,.05,0,true),m));\n    [-1,1].forEach(s=>{const st=cyl(.045,.05,.75,m,s*.12,1.95,0);st.rotation.z=-s*.25;g.add(st);[.25,.45,.62].forEach((t,k)=>{const b=cyl(.035,.04,.26,m,s*(.18+t*.18),2.0+t*.72,0);b.rotation.z=-s*(.9+k*.1);g.add(b)});g.add(cone(.08,.16,m,s*.28,1.9,.05,0,-s*1.2))});return g},\n  moose(m){const g=new THREE.Group(),pot=makeMaterial('#B5653A','pla');g.add(mesh(lathe([[0,0],[.78,0],[.82,.25],[.92,.3],[.95,1.5],[0,1.5]],48),pot));\n    g.add(mesh(lathe([[0,1.5],[.5,1.5],[.3,2.2],[.12,2.55],[0,2.6]],32),m));g.add(cyl(.07,.08,.45,m,0,2.5,.05));g.add(sph(.24,m,0,3.05,.08,1,1.05,1));g.add(sph(.16,m,0,2.98,.28,1,.8,1));eyes(g,.1,3.12,.27,.035);\n    [-1,1].forEach(s=>{const a=new THREE.Shape();a.moveTo(0,0);a.lineTo(.45,.12);a.lineTo(.55,.32);a.lineTo(.42,.22);a.lineTo(.4,.36);a.lineTo(.3,.2);a.lineTo(.22,.32);a.lineTo(.14,.14);a.closePath();\n      const an=mesh(new THREE.ExtrudeGeometry(a,{depth:.05,bevelEnabled:false}),m);an.position.set(s*.18,3.18,0);an.scale.x=s;g.add(an);\n      const leg=cyl(.06,.06,1.05,m,s*.2,.6,.95);g.add(leg);g.add(sph(.11,m,s*.2,.55,.97,1,.8,1.3));g.add(sph(.12,m,s*.22,1.52,.72,1.4,.5,2))});return g},\n  ghost(m){const g=new THREE.Group();g.add(rbox(1.3,1.25,1.25,.32,m,0,.75,0));for(let i=0;i<5;i++)g.add(sph(.17,m,-.5+i*.25,.17,.55,1,.6,.5));\n    g.add(rbox(1.15,.18,1.1,.04,dark(),0,.09,0));[-.28,.28].forEach(x=>{const e=cyl(.17,.17,.04,dark(),x,0,0,28);e.rotation.x=Math.PI/2;e.position.set(x,.9,.64);g.add(e)});\n    const mo=rbox(.42,.16,.04,.07,dark(),0,.52,.64);g.add(mo);g.add(rbox(.09,.09,.09,.02,makeMaterial('#7CFF3A','glow'),0,1.42,0));return g},\n  pyramid(m){const g=new THREE.Group();const N=16;for(let i=0;i<N;i++){const s=1.8*(1-i/N)+.06;g.add(mesh(new THREE.BoxGeometry(s,.13,s),m));g.children[i].position.y=.065+i*.13;g.children[i].rotation.y=i%2?.04:0}return g},\n  spiral(m){const g=new THREE.Group(),star=(R,n=10)=>{const s=new THREE.Shape();for(let i=0;i<=n*2;i++){const a=i/(n*2)*Math.PI*2,r=i%2?R*.86:R;i?s.lineTo(Math.cos(a)*r,Math.sin(a)*r):s.moveTo(Math.cos(a)*r,Math.sin(a)*r)}return s};\n    for(let k=0;k<9;k++){const R=1.1-k*.115,s=star(R),h=star(R-.07);s.holes.push(new THREE.Path(h.getPoints()));const r=mesh(new THREE.ExtrudeGeometry(s,{depth:.09,bevelEnabled:false}),m);r.rotation.x=-Math.PI/2;r.rotation.z=k*.18;r.position.y=k*.15;g.add(r)}\n    g.add(cyl(.07,.07,2.3,m,0,1.2,0));g.add(cone(.2,.35,m,0,1.35,0,Math.PI));return g},\n  'slinky-cat'(m){const g=new THREE.Group();g.add(rbox(.78,.66,.62,.24,m,0,.42,.62));[-1,1].forEach(s=>{g.add(cone(.12,.22,m,s*.24,.84,.62,0,-s*.2));g.add(sph(.1,m,s*.3,.08,.86,1,.6,1.5));g.add(sph(.1,m,s*.3,.08,-.95,1,.6,1.5))});\n    eyes(g,.16,.46,.94,.055);g.add(cone(.045,.06,dark(),0,.37,.94,Math.PI/2));for(let i=0;i<14;i++){const d=cyl(.34,.34,.035,m,0,0,0,32);d.rotation.x=Math.PI/2;d.position.set(0,.42,.25-i*.075);g.add(d)}\n    g.add(rbox(.74,.62,.4,.2,m,0,.42,-.9));const t=cyl(.06,.05,.45,m,0,.5,-1.05);t.rotation.x=-.9;g.add(t);return g},\n  'flexi-cat'(m){const g=new THREE.Group();g.add(rbox(.72,.6,.6,.24,m,0,.36,.55));[-1,1].forEach(s=>{g.add(cone(.11,.2,m,s*.22,.74,.55,0,-s*.2));g.add(sph(.11,m,s*.3,.08,.85,1,.6,1.5))});eyes(g,.15,.4,.86,.07);g.add(cone(.04,.06,makeMaterial('#FFB21F','pla'),0,.3,.86,Math.PI/2));\n    segs(g,m,4,1.4,.6,.5,.3,t=>1-t*.15);const tl=cyl(.07,.05,.5,m,0,.35,-1.25);tl.rotation.x=-.5;g.add(tl);return g},\n  shark(m){const g=new THREE.Group(),w=makeMaterial('#F4F1EC','pla');g.add(sph(.42,m,0,.42,.7,1,.85,1.25));g.add(sph(.4,w,0,.28,.72,.95,.5,1.2));eyes(g,.3,.5,1.05,.06);\n    g.   const items=cart.map(it=>{const p=P.find(x=>x.id===it.id);return `${it.q} × ${p.n} (${COLORS[it.col][0]}${it.name?', name: '+esc(it.name):''})`}).join('<br>');const t=total();
  cart=[];save();
  openSheet(`<div class="det"><h2>${paid?'Paid! Thank you':'Order saved'}</h2><p>${items}</p><div class="tot"><span>Total</span><span>$${t} CAD</span></div>
  <p>Pick up at <b>${PICKUP}</b>. We'll email you to set a time.</p><button class="btn" onclick="document.getElementById('sheet').click()">Keep shopping</button></div>`,'cart');
}
/* ---- Spin in 3D: one product, slowly turning, drag to spin. three.js loads only when first opened. ---- */
const loadJS=src=>new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});
let three,R,SC,CAM,CTRL,obj,mats=[],raf=0;
function initThree(){return three||(three=loadJS('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js').then(()=>loadJS('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js')).then(()=>{
  const THREE=window.THREE;R=new THREE.WebGLRenderer({antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.outputEncoding=THREE.sRGBEncoding;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.05;
  SC=new THREE.Scene();CAM=new THREE.PerspectiveCamera(32,1,.1,100);
  SC.add(new THREE.HemisphereLight(0xfff1e6,0x2a0f08,.75));const k=new THREE.DirectionalLight(0xffffff,2);k.position.set(3,6,5);SC.add(k);
  const r1=new THREE.DirectionalLight(0xff7a1f,1.2);r1.position.set(-5,3,-4);SC.add(r1);const r2=new THREE.DirectionalLight(0xffffff,.6);r2.position.set(0,2,-6);SC.add(r2);
  CTRL=new THREE.OrbitControls(CAM,R.domElement);CTRL.enableDamping=true;CTRL.enablePan=false;CTRL.autoRotate=!matchMedia('(prefers-reduced-motion: reduce)').matches;CTRL.autoRotateSpeed=2.2;
  window.makeMaterial=(c,id)=>{const m=new THREE.MeshStandardMaterial({color:new THREE.Color(c),roughness:.5,metalness:0,side:THREE.DoubleSide});if(id==='glow'){m.emissive=new THREE.Color(c);m.emissiveIntensity=1}mats.push(m);return m};
  window.mesh=(g,m)=>new THREE.Mesh(g,m);window.lathe=(pts,seg)=>new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);window.BUILD={};
  const sc=document.createElement('script');sc.textContent=MODELS_SRC;document.head.appendChild(sc);
}))}
async function show3D(p,color){
  try{await initThree()}catch(e){$('#v3d').innerHTML='<p class="note" style="padding:40px;text-align:center">3D could not load here. Try the photos.</p>';return}
  const THREE=window.THREE,box=$('#v3d');if(!box||box.hidden)return;box.innerHTML='';box.appendChild(R.domElement);
  if(obj){SC.remove(obj)}mats.forEach(m=>m.dispose());mats=[];window._dark=null;
  const main=makeMaterial(color,'pla');obj=new THREE.Group();const inner=BUILD[p.id](main);inner.userData.main=main;obj.add(inner);
  const b=new THREE.Box3().setFromObject(inner),c=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3());inner.position.set(-c.x,-b.min.y,-c.z);SC.add(obj);
  const h=Math.max(sz.y,sz.x*.8,sz.z*.8);CTRL.target.set(0,sz.y*.45,0);CAM.position.set(0,sz.y*.75+h*.35,h*2.7);CTRL.minDistance=h*1.2;CTRL.maxDistance=h*5;CTRL.update();
  const fit=()=>{const w=box.clientWidth||400;R.setSize(w,w,false);CAM.aspect=1;CAM.updateProjectionMatrix()};fit();
  cancelAnimationFrame(raf);(function loop(){raf=requestAnimationFrame(loop);CTRL.update();R.render(SC,CAM)})();
}
function recolor3D(c){if(obj&&window.THREE)obj.children[0].userData.main.color.set(c)}
function stop3D(){cancelAnimationFrame(raf)}
$('#cartBtn').onclick=openCart;
save();render();
if(location.hash==='#cart')openCart();
</script>
